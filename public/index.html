.tip{font-size:15px;line-height:1.45;min-height:22px}

.stat{font-size:14px;color:var(--muted);min-height:20px}
.btns{display:flex;gap:8px;flex-wrap:wrap}

@keyframes shk{0%,100%{transform:translate(0,0) rotate(0)}20%{transform:translate(-2px,1px) rotate(-3deg)}40%{transform:translate(2px,-1px) rotate(3deg)}60%{transform:translate(-2px,0) rotate(-2deg)}80%{transform:translate(2px,1px) rotate(2deg)}}

const W=800,H=480,X0=110,X1=600,CY=255,LEN=X1-X0,SP0=X0+0.2*LEN,SP1=X1;
const FX0=70,FX1=730;

const LEVELS=[

 {name:'金目鯛',diff:4,sea:1,H:116,iri:1,shape:{peak:.38,ped:.13,snout:.5,asym:.05,tail:'fork',deep:1,ts:1,dorsal:'spiny',mouth:'mid',mouthY:.1,k:1.3},body:['#a81c2a','#e0535c','#f4b7b0'],fin:'#c22a35',sf:'rgba(255,215,210,.5)',sl:'rgba(120,20,30,.6)',sc:8,bone:.12,curve:9,pieces:6,grams:900,bigEye:1},
 {name:'劍旗魚',diff:5,sea:1,H:82,shape:{peak:.3,ped:.09,snout:.7,asym:.04,tail:'lunate',ts:1.15,dorsal:'sail',anal:'sickle',mouth:'mid',k:1.55,keel:1},body:['#262a48','#7c7f99','#e8e6ee'],fin:'#2c3050',sf:'rgba(230,230,245,.45)',sl:'rgba(40,44,70,.55)',sc:6,bone:.1,curve:11,pieces:7,grams:3000,bill:1,flesh:['#f6e0d6','#ebbfae','#f8e8e0']},
 {name:'藍鰭吞拿',diff:5,sea:1,boss:1,H:112,iri:1,shape:{peak:.45,ped:.07,snout:.78,asym:.04,tail:'lunate',ts:1.1,dorsal:'double',big2:1,anal:'sickle',mouth:'mid',k:1.85,keel:1,pecLong:1},body:['#111d38','#56698a','#e9edf0'],fin:'#1a2744',sf:'rgba(215,228,245,.4)',sl:'rgba(20,30,60,.55)',sc:6,bone:.07,curve:14,pieces:8,grams:4000,finlets:1,flesh:['#d23c4a','#a01a2c','#f4a3ad']},
];
const FLESH=['#f7dccb','#f0bfa7','#f9e6d9'];
let lvl=0,L=LEVELS[0],state='menu';
let bodyP,fins,spots=[],cells=[],parts=[],floats=[],trail=[];
let scaleStarted=0,scaleTime=0,s1=0,s2=0,s3=0,yieldV=1,boneHits=0,cleanV=0;

const rankOf=t=>t>=920?['刀神','★★★★★']:t>=800?['大廚','★★★★☆']:t>=650?['熟手師傅','★★★☆☆']:t>=450?['魚檔學徒','★★☆☆☆']:['新手','★☆☆☆☆'];

// ---------- audio ----------
let ac=null,lastTick=0;
function au(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){ac=null}}return ac}
function noise(dur,freq,vol){const a=au();if(!a)return;try{const len=Math.floor(a.sampleRate*dur),buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);const s=a.createBufferSource();s.buffer=buf;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;const g=a.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(a.destination);s.start()}catch(e){}}
function tick(){const n=performance.now();if(n-lastTick>55){lastTick=n;noise(.035,2800+Math.random()*1500,.12)}}
function chop(){noise(.13,500,.6);try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}}

// ---------- geometry ----------
function prof(t){const S=L.shape||{},pk=S.peak||.33,sn=S.snout||.62,pd=S.ped||.16,kk=S.k||1.35;if(t<=0)return 0;if(t>=1)return pd;if(t<=pk)return Math.pow(Math.sin(Math.PI/2*t/pk),sn);const u=(t-pk)/(1-pk);return 1-(1-pd)*Math.pow(u,kk)}
const tOf=x=>(x-X0)/LEN;
const ASY=()=>(L.shape&&L.shape.asym!=null)?L.shape.asym:.06;
const topY=x=>CY-L.H*prof(tOf(x))*(1+ASY());
const botY=x=>CY+L.H*prof(tOf(x))*(1-ASY());
const spineY=x=>{const t=tOf(x);return CY-L.H*.1*prof(t)+L.curve*Math.sin((t-.2)*Math.PI*1.6)};
function seeded(s){return()=>{s=(s*16807)%2147483647;return s/2147483647}}

function buildFish(){
  bodyP=new Path2D();bodyP.moveTo(X0,CY);
  for(let x=X0;x<=X1;x+=3)bodyP.lineTo(x,topY(x));
  bodyP.lineTo(X1,topY(X1));
  for(let x=X1;x>=X0;x-=3)bodyP.lineTo(x,botY(x));
  bodyP.closePath();
  fins=buildFins();
  spots=[];{const r=seeded(7);if(L.pattern==='spots')for(let i=0;i<70;i++){const x=X0+LEN*(.12+r()*.86);spots.push({x,y:topY(x)+(botY(x)-topY(x))*r()*.8,r:3+r()*5,c:'rgba(55,32,18,.35)'})}

  buildLight();
  buildTexture();
  cells=[];const S=L.sc;let row=0;const rr=seeded(5);
  for(let y=CY-L.H*1.2;y<CY+L.H*1.1;y+=S*.74,row++){for(let x=SP0-2+(row%2)*S/2;x<X1+4;x+=S){if(y>topY(x)+2&&y<botY(x)-2){const t=tOf(x),hf=halfAt(x),v=Math.abs((y-(topY(x)+botY(x))/2)/hf);cells.push({x,y,s:1,r:S*.8*(.7+.3*Math.min(1,prof(t)/.6))*(1-.18*v),a:.62+rr()*.38})}}}
  scaleDirty=true;
}


function tailPath(){const S=L.shape||{},tp=S.tail||'fork',k=S.ts||1,ph=L.H*(S.ped||.16)*(1+ASY()*.5),x=X1-6,p=new Path2D();let reach=95*k,spread=.85*k;
  if(tp==='lunate'){p.moveTo(x,CY-ph);p.quadraticCurveTo(X1+28*k,CY-ph-6,X1+72*k,CY-L.H*1.05*k);p.quadraticCurveTo(X1+44*k,CY-L.H*.32*k,X1+26*k,CY);p.quadraticCurveTo(X1+44*k,CY+L.H*.32*k,X1+72*k,CY+L.H*1.05*k);p.quadraticCurveTo(X1+28*k,CY+ph+6,x,CY+ph);reach=74*k;spread=1.05*k}
  else if(tp==='truncate'){p.moveTo(x,CY-ph);p.quadraticCurveTo(X1+30*k,CY-ph-12,X1+72*k,CY-L.H*.62*k);p.quadraticCurveTo(X1+62*k,CY,X1+72*k,CY+L.H*.62*k);p.quadraticCurveTo(X1+30*k,CY+ph+12,x,CY+ph);reach=72*k;spread=.62*k}
  else if(tp==='round'){p.moveTo(x,CY-ph);p.bezierCurveTo(X1+36*k,CY-L.H*.62*k,X1+92*k,CY-L.H*.48*k,X1+92*k,CY);p.bezierCurveTo(X1+92*k,CY+L.H*.48*k,X1+36*k,CY+L.H*.62*k,x,CY+ph);reach=92*k;spread=.5*k}
  else if(tp==='wedge'){p.moveTo(x,CY-ph);p.bezierCurveTo(X1+22*k,CY-ph-L.H*.25*k,X1+60*k,CY-L.H*.5*k,X1+88*k,CY);p.bezierCurveTo(X1+60*k,CY+L.H*.5*k,X1+22*k,CY+ph+L.H*.25*k,x,CY+ph);reach=88*k;spread=.4*k}
  else{p.moveTo(x,CY-ph);p.quadraticCurveTo(X1+40*k,CY-ph-10,X1+95*k,CY-L.H*.85*k);p.quadraticCurveTo(X1+(S.deep?46:64)*k,CY,X1+95*k,CY+L.H*.85*k);p.quadraticCurveTo(X1+40*k,CY+ph+10,x,CY+ph)}
  p.closePath();p._bb={ox:x-4,oy:CY,tail:1,tx:X1+reach+6,x0:CY-L.H*spread,x1:CY+L.H*spread};p._a=.93;return p}
function finAt(t){return X0+t*LEN}

const cutYf=x=>{if(!cutArr)return spineY(x);let i=Math.round(x-X0);i=Math.max(0,Math.min(cutArr.length-1,i));return cutArr[i]};
function makeFilletPath(){const p=new Path2D();p.moveTo(SP0,cutYf(SP0));for(let x=SP0;x<=X1;x+=2)p.lineTo(x,topY(x));p.lineTo(X1,topY(X1));for(let x=X1;x>=SP0;x-=2)p.lineTo(x,cutYf(x));p.closePath();return p}

function drawReveal(){
  const e=1-Math.pow(1-revealT,3),lift=95*e;

    ctx.fillStyle=(L.flesh||FLESH)[1];ctx.fillRect(x,c,2.4,Math.max(0,s+8-c));

  ctx.strokeStyle='rgba(150,130,100,.6)';ctx.lineWidth=1;for(let x=SP0+6;x<X1;x+=9){const y=spineY(x);ctx.beginPath();ctx.moveTo(x,y-3);ctx.lineTo(x,y+3);ctx.stroke()}

  ctx.fillStyle='#fffbe8';for(let x=SP0;x<=X1;x+=7){if(cutYf(x)-spineY(x)>7){ctx.fillRect(x,cutYf(x)-3,4,3)}}

function buildFillet(){
  const n=FX1-FX0;const hs=[];let maxh=0;
  for(let i=0;i<=n;i++){const x=SP0+(i/n)*(X1-SP0);const h=Math.max(0,cutYf(x)-topY(x));hs.push(h);if(h>maxh)maxh=h}
  const k=230/Math.max(1,maxh);fil={n,top:new Float32Array(n+1),bot:new Float32Array(n+1),cum:new Float64Array(n+1)};let cum=0;
  for(let i=0;i<=n;i++){const hh=hs[i]*k;fil.top[i]=255-hh*.52;fil.bot[i]=255+hh*.48;if(i>0)cum+=Math.pow((hs[i]+hs[i-1])/2,1.5);fil.cum[i]=cum}
  fil.total=cum;fil.G=Math.round(L.grams*.4*yieldV/10)*10;
  const p=new Path2D();p.moveTo(FX0,fil.bot[0]);for(let i=0;i<=n;i+=2)p.lineTo(FX0+i,fil.top[i]);p.lineTo(FX1,fil.top[n]);for(let i=n;i>=0;i-=2)p.lineTo(FX0+i,fil.bot[i]);p.closePath();fil.path=p;
  const t=new Path2D();t.moveTo(FX0,fil.top[0]);for(let i=0;i<=n;i+=2)t.lineTo(FX0+i,fil.top[i]);fil.skin=t;
}

function drawCutStage(){

function strokeYAt(x,pts){let s=0,c=0;for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];if((a.x-x)*(b.x-x)<=0&&a.x!==b.x){s+=a.y+(b.y-a.y)*(x-a.x)/(b.x-a.x);c++}}return c?s/c:null}
function evalFillet(){
  const step=3;let waste=0,total=0,bone=0,cov=0,n=0;
  for(let x=SP0;x<=SP1;x+=step){n++;const sy=spineY(x),ty=topY(x),meat=sy-ty;total+=meat;const y=strokeYAt(x,stroke);
    if(y==null){waste+=meat*.5;continue}cov++;const d=sy-y,tol=3;
    if(d>tol)waste+=Math.min(meat,d-tol);else if(d<-tol){waste+=Math.min(meat,-d-tol);if(-d>7)bone++}}

  const m=fil.G/L.pieces;const mad=pieces.reduce((s,w)=>s+Math.abs(w-m),0)/pieces.length;const ev=1-mad/m;evenV=ev;

function writeMine(){wq=wq.then(()=>post({}).catch(()=>false));return wq}
function submitOnline(fish,tot){wq=wq.then(()=>post({fish,score:tot}).catch(()=>false));return wq}
function lbRows(f){return Object.entries(board).map(([id,v])=>{const b=safeBest(v.best);const sc=f==='__all'?Object.values(b).reduce((a,x)=>a+x,0):(b[f]||0);return{id,nick:cleanNick(v.nick)||'無名刀手',sc,n:Object.keys(b).length,plays:Math.round(+v.plays||0)}}).filter(r=>r.sc>0).sort((a,b)=>b.sc-a.sc)}
function myRank(f){const r=lbRows(f);const i=r.findIndex(x=>x.id===UID);return i<0?null:[i+1,r.length]}
function showLB(){lbOpen=true;$('ov').classList.remove('hide');renderLB();loadBoard()}
function renderLB(){
  const ov=$('ov');if(!lbOpen)return;
  const focusNick=document.activeElement&&document.activeElement.id==='lbNick';if(focusNick)return;
  let status='';
  if(!ONLINE)status='⚠️ 連唔到排行榜伺服器，請檢查網絡再試。';
  const rows=lbRows(lbFish).slice(0,30);
  const medal=i=>i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
  const list=rows.map((r,i)=>`<tr${r.id===UID?' class="me"':''}><td>${medal(i)}</td><td>${esc(r.nick)}${r.id===UID?' （你）':''}</td><td><b>${r.sc}</b></td><td>${lbFish==='__all'?r.n+' 款':rankOf(r.sc)[0]}</td></tr>`).join('')||`<tr><td colspan="4" style="text-align:center;color:#a8957c">${ONLINE?'未有人上榜，快啲做第一個！':'—'}</td></tr>`;
  const mr=UID?myRank(lbFish):null;
  ov.innerHTML=`<div class="card"><h2>🏆 刀工排行榜</h2>
  ${status?`<p class="lbstat">${status}</p>`:''}
  ${UID?`<div class="nickrow"><input id="lbNick" maxlength="14" placeholder="你嘅花名" value="${esc(nick)}"><button class="pri" id="lbSave">儲存花名</button></div>`:''}
  <select id="lbSel"><option value="__all">總排行（各款魚最高分加埋）</option>${LEVELS.map(l=>`<option value="${esc(l.name)}"${lbFish===l.name?' selected':''}>${l.boss?'👑 ':''}${l.name}</option>`).join('')}</select>
  ${mr?`<p class="lbme">你排第 <b>${mr[0]}</b> 名（共 ${mr[1]} 人）</p>`:''}
  <div class="tw"><table class="rec"><tr><th>名次</th><th>花名</th><th>分數</th><th>${lbFish==='__all'?'劏過':'等級'}</th></tr>${list}</table></div>
  <div class="cbtns"><button class="pri" id="lbBack">返回揀魚</button></div></div>`;
  const sel=$('lbSel');sel.value=lbFish;sel.onchange=()=>{lbFish=sel.value;renderLB()};
  $('lbBack').onclick=()=>{lbOpen=false;showMenu()};
  if($('lbSave'))$('lbSave').onclick=async()=>{nick=cleanNick($('lbNick').value)||'無名刀手';try{localStorage.setItem('fishKnifeNick',nick)}catch(e){}
    $('lbSave').textContent='儲存中…';$('lbNick').blur();if(board[UID]){await writeMine()}renderLB()};
}
function showRecords(){
  const ov=$('ov');ov.classList.remove('hide');
  const n=hist.length,avg=n?Math.round(hist.reduce((a,h)=>a+h.t,0)/n):0,top=n?Math.max(...hist.map(h=>h.t)):0;
  const gods=hist.filter(h=>h.t>=920).length;
  const pct=v=>v==null?'—':(v*100).toFixed(1)+'%';
  const rows=LEVELS.map(l=>{const hs=hist.filter(h=>h.f===l.name);if(!hs.length)return `<tr style="color:#a8957c"><td>${l.boss?'👑 ':''}${l.name}</td><td>—</td><td>—</td><td>—</td><td>0</td></tr>`;
    const b=Math.max(...hs.map(h=>h.t));return `<tr><td>${l.boss?'👑 ':''}${l.name}</td><td><b>${b}</b></td><td>${rankOf(b)[0]}</td><td>${pct(Math.max(...hs.map(h=>h.y)))}</td><td>${hs.length}</td></tr>`}).join('');
  const fmt=d=>{const t=new Date(d);return `${t.getDate()}/${t.getMonth()+1} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`};
  const recent=hist.slice(-15).reverse().map(h=>`<tr><td>${fmt(h.d)}</td><td>${h.f}</td><td><b>${h.t}</b></td><td>${rankOf(h.t)[0]}</td><td>${pct(h.u)}</td></tr>`).join('')||'<tr><td colspan="5" style="text-align:center;color:#a8957c">未有紀錄，快啲去劏條魚！</td></tr>';
  ov.innerHTML=`<div class="card"><h2>📒 刀工紀錄簿</h2>
  <div class="recsum"><div><b>${n}</b><span>總場數</span></div><div><b>${top}</b><span>最高分</span></div><div><b>${avg}</b><span>平均分</span></div><div><b>${gods}</b><span>刀神次數</span></div></div>
  <h3>各款魚最佳紀錄</h3><div class="tw"><table class="rec"><tr><th>魚</th><th>最高</th><th>等級</th><th>最佳出肉</th><th>場數</th></tr>${rows}</table></div>
  <h3>最近 15 場</h3><div class="tw"><table class="rec"><tr><th>時間</th><th>魚</th><th>分</th><th>等級</th><th>利用率</th></tr>${recent}</table></div>
  <p style="font-size:12px;color:#8a6f50;margin:8px 0 0">紀錄只係儲喺呢部機嘅瀏覽器入面。</p>
  <div class="cbtns"><button class="pri" id="recBack">返回揀魚</button><button class="sec" id="recClr" style="background:#fff;color:#b3261e;border:2px solid #b3261e">清除紀錄</button></div></div>`;
  $('recBack').onclick=showMenu;
  $('recClr').onclick=()=>{const b=$('recClr');if(b.dataset.c){hist=[];best={};saveHist();try{localStorage.setItem('fishKnifeBest2','{}')}catch(e){}showRecords()}else{b.dataset.c=1;b.textContent='再㩒一次確認清除'}};
}
function showResult(){
  const tot=s1+s2+s3;const isBest=tot>(best[L.name]||0);if(isBest){best[L.name]=tot;try{localStorage.setItem('fishKnifeBest2',JSON.stringify(best))}catch(e){}}
  const rank=rankOf(tot);submitOnline(L.name,tot).then(ok=>{const e=$('rOnline');if(!e)return;if(ok){const r=myRank(L.name);e.textContent=r?`🏆 已上傳！你喺${L.name}排第 ${r[0]} 名（共 ${r[1]} 人）`:'🏆 已上傳排行榜';}else e.textContent=''});hist.push({f:L.name,t:tot,a:s1,b:s2,c:s3,cl:+cleanV.toFixed(3),y:+yieldV.toFixed(3),e:+evenV.toFixed(3),u:+util.toFixed(3),d:Date.now()});saveHist();
  const ac2=auntieComment(tot,evenV);const ov=$('ov');ov.classList.remove('hide');
  ov.innerHTML=`<div class="card" style="text-align:center"><h2>${L.name} · 完成！</h2><div class="stars">${rank[1]}</div><div class="big">${tot}</div><div class="rank">${rank[0]}</div>${isBest?'<div style="color:#b3261e;font-weight:900;margin-top:6px">🎉 新紀錄！</div>':''}
  <div id="rOnline" style="font-size:13px;font-weight:800;color:#8a5a00;min-height:18px;margin-top:4px">${'上傳緊排行榜…'}</div><div class="aunt">${auntieSVG(ac2.mood)}<div class="bubble">${ac2.html}<small>— 街市熟客 陳師奶</small></div></div><table class="rows"><tr><td>① 起鱗（清潔度 ${Math.floor(cleanV*100)}%）</td><td>${s1}/300</td></tr><tr><td>② 起骨（出肉率 ${(yieldV*100).toFixed(1)}%）</td><td>${s2}/400</td></tr><tr><td>③ 切件（${pieces.map(w=>Math.round(w)).join(' / ')}g）</td><td>${s3}/300</td></tr><tr><td><b>魚肉利用率</b></td><td>${(util*100).toFixed(1)}%</td></tr></table>
  <div class="cbtns"><button class="pri" id="rAgain">再劏一條</button>${lvl<LEVELS.length-1?'<button class="pri" id="rNext">下一條魚 →</button>':''}<button class="sec" id="rLB" style="background:#c8901a;color:#fff">🏆 排行榜</button><button class="sec" id="rRec" style="background:#fff;color:#2b1e12;border:2px solid #2b1e12">📒 紀錄簿</button><button class="sec" id="rMenu" style="background:#2b1e12;color:#f6eedd">揀魚</button></div></div>`;
  $('rAgain').onclick=startLevel;if($('rNext'))$('rNext').onclick=()=>{lvl++;startLevel()};$('rMenu').onclick=showMenu;$('rRec').onclick=showRecords;$('rLB').onclick=showLB;
  btn('btnA');
}

// ---------- input ----------
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
let last=null,wrongDir=0;
function scrapeSeg(a,b){
  const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d<.5)return;const dir=dx/d;
  const k=dir<-.3?.34:dir>.3?.07:.14;if(dir>.3){wrongDir++;if(wrongDir>25){$('tip').innerHTML='⚠️ 順住鱗刮唔甩！要<b>由魚尾刮向魚頭（向左）</b>。';wrongDir=0}}
  const n=Math.ceil(d/5),R=22,R2=R*R;let rem=0;
  for(let i=1;i<=n;i++){const px=a.x+dx*i/n,py=a.y+dy*i/n;
    for(const c of cells){if(c.s<=0)continue;const ex=c.x-px,ey=c.y-py;if(ex*ex+ey*ey<R2){const b4=c.s;c.s=Math.max(0,c.s-k);rem+=b4-c.s;scaleDirty=true;
      if(b4>.35&&c.s<=.35&&parts.length<220)parts.push({x:c.x,y:c.y,vx:dir*(1.5+Math.random()*3),vy:-2-Math.random()*3,r:Math.random()*6,vr:(Math.random()-.5)*.4,life:45})}}}
  if(rem>0){if(!scaleStarted)scaleStarted=performance.now();tick();let s=0;for(const c of cells)s+=c.s;cleanV=1-s/cells.length;scaleStat();if(cleanV>=.985)finishScale()}
}
const downs=new Set();let activeId=null,aborted=false;
function abortStroke(){drawing=false;last=null;stroke=[];cutStroke=[];trail=[];aborted=true;
  if(state==='fillet'||state==='cut'||state==='scale')$('tip').innerHTML='✋ 只可以用<b>一隻手指</b>！呢一刀唔計，放開手再嚟過。';}
cv.addEventListener('pointerdown',e=>{
  if(state==='menu')return;e.preventDefault();au();downs.add(e.pointerId);
  if(downs.size>1||aborted){abortStroke();return}
  activeId=e.pointerId;try{cv.setPointerCapture(e.pointerId)}catch(_){}
  const p=pos(e);drawing=true;last=p;trail.push({...p,t:performance.now()});
  if(state==='fillet')stroke=[p];
  if(state==='cut')cutStroke=[p];
});
cv.addEventListener('pointermove',e=>{
  if(!drawing||e.pointerId!==activeId)return;e.preventDefault();const p=pos(e);trail.push({...p,t:performance.now()});
  if(state==='scale'&&last)scrapeSeg(last,p);
  if(state==='fillet'){const q=stroke[stroke.length-1];if(!q||Math.hypot(p.x-q.x,p.y-q.y)>2){stroke.push(p);if(Math.random()<.3)noise(.03,1200,.08)}}
  if(state==='cut')cutStroke.push(p);
  last=p;
});
function up(e){
  downs.delete(e.pointerId);
  if(e.pointerId!==activeId){if(!downs.size){aborted=false;activeId=null}return}
  activeId=null;
  if(e.type==='pointercancel'&&drawing){abortStroke()}
  if(!downs.size)aborted=false;
  if(!drawing)return;drawing=false;last=null;
  if(state==='fillet'&&stroke.length>3)evalFillet();
  if(state==='cut'&&cutStroke.length>1){
    let mx=0,mn=1e9,mxY=-1e9;for(const p of cutStroke){mx+=p.x;mn=Math.min(mn,p.y);mxY=Math.max(mxY,p.y)}mx/=cutStroke.length;
    const i=gIdx(mx);const xs=cutStroke.map(p=>p.x),spread=Math.max(...xs)-Math.min(...xs);
    if(i<4||i>fil.n-4){}else if(spread>70){$('tip').innerHTML='刀要<b>直落</b>，斜得太緊要喇！'}
    else if(mn<=fil.top[i]+12&&mxY>=fil.bot[i]-12&&!cuts.some(c=>Math.abs(c-mx)<6)){cuts.push(mx);chop();cutStat();if(cuts.length>=L.pieces-1){state='cutwait';setTimeout(finishCut,350)}}
    else{$('tip').innerHTML='未切斷！要由魚柳<b>上面劃到下面</b>成條切過。'}
  }
}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

function resize(){const r=cv.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(r.width*d);cv.height=Math.round(r.width*H/W*d)}
window.addEventListener('resize',resize);
resize();showMenu();render();
})();
</script>
